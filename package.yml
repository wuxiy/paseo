package: cloud.lazycat.app.paseo
# Tracks the upstream release (getpaseo/paseo). Bump together with the
# ghcr.io/getpaseo/paseo tag used by lzc/build.sh; see README-lzc.md.
version: 0.12.0-beta.3
name: Paseo
description: One interface for Claude Code, Codex, Copilot, OpenCode, Pi and other coding agents - self-hosted daemon plus web UI, packaged from the official upstream image
author: wuxiy
license: Apache-2.0
homepage: https://github.com/getpaseo/paseo
# The daemon launches coding agents that can run any command in its
# workspace: keep it to box administrators.
admin_only: true
locales:
  zh-CN:
    name: Paseo
    description: 在一处指挥 Claude Code、Codex、Copilot、OpenCode 等 AI 编程 agent。官方镜像自带 daemon 与网页界面，已预装常用 agent CLI，随时在浏览器里跑多个并行任务。
  en-US:
    name: Paseo
    description: One interface for Claude Code, Codex, Copilot, OpenCode and other coding agents. The upstream daemon and web UI, with the common agent CLIs baked in.
permissions:
  required:
    - net.internet
