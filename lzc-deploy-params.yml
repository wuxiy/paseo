# Optional install parameters for the Paseo lpk.
params:
  - id: paseo_password
    type: string
    name: Paseo 访问密码（可选）
    description: >-
      留空：网页界面直接使用，不再要求第二个密码（懒猫账号登录已经保护了这个域名）。
      填写后：浏览器和第三方 Paseo 客户端（桌面端/手机端直连、CLI）都需要输入这个
      密码。用于要让懒猫账号之外的客户端直连 daemon 的场景。
      密码保存在盒子上，随时可以在应用设置里修改。
    optional: true
