# Optional install parameters for the Paseo lpk.
params:
  - id: paseo_password
    type: string
    name: Paseo 访问密码（可选）
    description: >-
      留空：使用按盒子生成的随机密码（在应用的「使用须知」里可以看到），
      局域网里的手机 App、桌面端、CLI 都用它连 http://<盒子局域网IP>:6767。
      填写：用你指定的密码替换随机密码。
      改了密码之后，已保存旧密码的客户端需要重新输入；浏览器打开本应用时
      Paseo 也会要一次这个密码（懒猫账号登录仍然在它前面）。
    optional: true
